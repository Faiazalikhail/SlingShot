services:
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./php-app/public:/var/www/html/public:ro
    depends_on:
      - php
      - fastapi

  php:
    build: ./php-app
    volumes:
      - ./php-app:/var/www/html
    environment:
      - DB_HOST=mysql
      - DB_NAME=${DB_NAME:-hawkvision}
      - DB_USER=${DB_USER:-hawkvision}
      - DB_PASS=${DB_PASS:-secret}
      - REDIS_HOST=redis
      - S3_BUCKET=${S3_BUCKET}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_KEY=${S3_KEY}
      - S3_SECRET=${S3_SECRET}
      - JWT_SECRET=${JWT_SECRET:-changeme}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  fastapi:
    build: ./fastapi-worker
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./fastapi-worker:/app
    environment:
      - DB_HOST=mysql
      - DB_NAME=${DB_NAME:-hawkvision}
      - DB_USER=${DB_USER:-hawkvision}
      - DB_PASS=${DB_PASS:-secret}
      - REDIS_HOST=redis
      - S3_BUCKET=${S3_BUCKET}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_KEY=${S3_KEY}
      - S3_SECRET=${S3_SECRET}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: ./fastapi-worker
    command: rq worker --url redis://redis:6379 hawkvision
    volumes:
      - ./fastapi-worker:/app
    environment:
      - DB_HOST=mysql
      - DB_NAME=${DB_NAME:-hawkvision}
      - DB_USER=${DB_USER:-hawkvision}
      - DB_PASS=${DB_PASS:-secret}
      - REDIS_HOST=redis
      - S3_BUCKET=${S3_BUCKET}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_KEY=${S3_KEY}
      - S3_SECRET=${S3_SECRET}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  mysql:
    image: mysql:8.0
    environment:
      - MYSQL_DATABASE=${DB_NAME:-hawkvision}
      - MYSQL_USER=${DB_USER:-hawkvision}
      - MYSQL_PASSWORD=${DB_PASS:-secret}
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASS:-rootsecret}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data:
