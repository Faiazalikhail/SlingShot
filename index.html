<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Balkh — Training Range</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background-color: #000;
        font-family: 'Courier New', Courier, monospace;
        user-select: none;
      }
      #canvas-container {
        width: 100vw;
        height: 100vh;
        display: block;
      }
      #hud {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 20px;
        box-sizing: border-box;
      }
      .hud-text {
        color: rgba(255, 255, 255, 0.7);
        text-shadow: 1px 1px 2px black;
      }
      #force-meter-container {
        position: absolute;
        bottom: 40px;
        left: 50%;
        transform: translateX(-50%);
        width: 200px;
        height: 10px;
        background: rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 5px;
        overflow: hidden;
      }
      #force-meter-fill {
        width: 0%;
        height: 100%;
        background: white;
        transform-origin: left;
      }
      #weapon-info {
        position: absolute;
        bottom: 40px;
        right: 40px;
        font-size: 18px;
        background: rgba(0,0,0,0.5);
        padding: 10px;
        border: 1px solid rgba(255,255,255,0.3);
      }
      #restart-btn {
        position: absolute;
        top: 20px;
        right: 20px;
        pointer-events: auto;
        background: rgba(0,0,0,0.5);
        color: white;
        border: 1px solid white;
        padding: 10px 20px;
        cursor: pointer;
        font-family: inherit;
        z-index: 20;
      }
      #restart-btn:hover {
        background: rgba(255,255,255,0.2);
      }

      /* ── Ammo selector ────────────────────────── */
      #ammo-bar {
        position: absolute;
        bottom: 70px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 8px;
        align-items: flex-end;
        pointer-events: none;
      }
      .ammo-slot {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        padding: 8px 12px;
        background: rgba(0,0,0,0.55);
        border: 1px solid rgba(255,255,255,0.2);
        border-radius: 6px;
        color: rgba(255,255,255,0.5);
        font-size: 12px;
        min-width: 72px;
        transition: border-color 0.15s, color 0.15s;
      }
      .ammo-slot.ammo-active {
        border-color: rgba(255,255,255,0.9);
        color: #fff;
        box-shadow: 0 0 8px rgba(255,255,255,0.3);
      }
      .ammo-dot {
        width: 14px; height: 14px;
        border-radius: 50%;
        margin-bottom: 2px;
      }
      .ammo-key {
        font-size: 10px;
        opacity: 0.6;
      }
      .ammo-name {
        font-weight: bold;
        font-size: 13px;
      }
      #ammo-desc {
        position: absolute;
        bottom: 56px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 11px;
        color: rgba(255,255,255,0.6);
        white-space: nowrap;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="canvas-container"></div>
    <div id="hud">
      <div>
        <h1 class="hud-text" style="margin: 0; font-size: 24px;">Project Balkh</h1>
        <div class="hud-text" style="font-size: 12px; margin-top: 5px;">Kinetic Force Simulation v2.0</div>
      </div>
      <div>
        <div id="mode-indicator" class="hud-text" style="text-align: center; font-size: 18px; margin-bottom: 10px; opacity: 0; color: #ff4444;">OVERDRAW ENGAGED</div>
        <div id="force-meter-container">
          <div id="force-meter-fill"></div>
        </div>
      </div>
    </div>
    <!-- Ammo selector -->
    <div id="ammo-bar">
      <div class="ammo-slot ammo-active" id="ammo-slot-0">
        <div class="ammo-dot" style="background:#888"></div>
        <div class="ammo-name">Stone</div>
        <div class="ammo-key">[3]</div>
      </div>
      <div class="ammo-slot" id="ammo-slot-1">
        <div class="ammo-dot" style="background:#333"></div>
        <div class="ammo-name">Boulder</div>
        <div class="ammo-key">[4]</div>
      </div>
      <div class="ammo-slot" id="ammo-slot-2">
        <div class="ammo-dot" style="background:#ff4400"></div>
        <div class="ammo-name">Explosive</div>
        <div class="ammo-key">[5]</div>
      </div>
      <div class="ammo-slot" id="ammo-slot-3">
        <div class="ammo-dot" style="background:#44aaff"></div>
        <div class="ammo-name">Burst</div>
        <div class="ammo-key">[6]</div>
      </div>
    </div>
    <div id="ammo-desc" class="hud-text">Balanced shot — reliable arc</div>

    <div id="weapon-info" class="hud-text">Weapon: Precision Sling</div>
    <button id="restart-btn">Restart Level</button>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
